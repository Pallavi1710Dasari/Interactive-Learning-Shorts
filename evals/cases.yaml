      template_includes: [state]

  - id: E068
    name: A bullet-note section too thin to cite is caught before any model call
    why: >
      THE REAL BUG THIS FIXES, frozen from what actually shipped. A user uploaded
      slide-note material and generated a short for "html_images_syntax_and_void_
      elements" — two bullet points and a code fence, one real sentence: "HTML
      elements like `<img />` are called void elements because they don't require
      an end tag." check_plan_depth PASSED this section (the understanding step
