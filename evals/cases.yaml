    type: unit_grader
    grader: one_hero_per_frame
    fixture: evals/fixtures/visual_state_happens.json
    expect:
      passed: true

  - id: E067
    name: A push/pop beat is drawn with the state template
    why: >
      The behavioural half. E064 to E066 prove the capability is wired and visible
