  - id: E081
    name: A markdown table's data rows count as citable facts
    why: >
      THE REAL BUG THIS FIXES. A user generating a reel for "how does reduce()
      combine array elements into a single value using an accumulator?" hit
      exactly E068's failure mode on material that was not actually thin: one
      real sentence of prose plus a four-row step trace (array state and
      accumulator value after each call) walked through as a markdown table.
      _citable_spans had no notion of a table at all before this — a table has
      no sentence-ending punctuation, so its header and separator glued into one
      line with none, and that line's own `---` separator happened to satisfy
      _is_code_quote's "looks like code" pattern (`--` reads as an operator). So
      a four-fact trace registered as ONE span, and the wrong one: a separator
      row, not a single row of actual data.

      This fixture is that section, reconstructed: a real intro sentence plus
      the four-step reduce() trace as a proper GFM table. _table_rows now reads
      each data row as its own fact and drops the header and separator before
      the sentence-splitter ever sees them, so the section correctly reads as
      six distinct citable spans (the intro sentence, the example sentence, and
      four table rows) rather than one.
    type: golden
    step: section_richness
    input: evals/fixtures/reduce_accumulator_material.md
    section_id: "how_does_reduce_combine_array_elements_i"
    expect:
      passed: true

