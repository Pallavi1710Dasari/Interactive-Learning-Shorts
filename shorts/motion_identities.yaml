# The motion-reel LANGUAGE IDENTITY registry (RESTYLE_TO_MOTION_REELS.md, phase 3
# badges). REEL_STYLE=motion only. It replaces the retired avatar registry
# (motion_avatars.yaml, in git history at 257df1c): motion reels draw no people,
# like both reference reels.
#
# Every course language gets an identity, which is how a viewer knows within
# the first second which language the reel is about:
#   name     the display name (badge, hook chip, end card)
#   colour   the signature colour, #RRGGBB. The player never draws it raw on a
#            field: shorts/motion_identities.py derives a lighter tone for the
#            dark fields (navy, blue) and a darker tone for the light fields
#            (paper, yellow), each with at least 3:1 contrast against both of
#            its fields, and refuses a colour whose signature or tones sit
#            within 60 RGB units of coral (#F2555A), mint (#17B27B) or lavender
#            (#B9A8FF), the reserved failure / success / system-added colours.
#   symbol   an ORIGINAL geometric mark on a 100 x 100 grid, built from simple
#            shapes. Never the language's official logo or mascot, and never a
#            look-alike of one: no snakes, no coffee cups, no atom orbits, no
#            whales, no shields, no hexagons for Node, no "JS" square.
#            Shapes: {rect: [x, y, w, h], r} | {circle: [cx, cy, r]} |
#            {path: "<svg path>", stroke: w}; add `stroke: w` to outline a rect or
#            circle instead of filling it, and `tone: soft` to draw it at 35 %.
#   file     the code editor tab's file name for this language
#   voice    which shared character voice speaks this language's lines in a
#            two-speaker reel (voices.character_1 or voices.character_2)
#
# Voices belong to IDENTITIES, not people (user decision 2026-10-09, the 4-slot
# plan in docs/reference/phase3/voices.md): one narrator voice, one host voice,
# and two character voices shared across the languages. A slot's clip is
# voices/motion/<slot>.wav; until it exists the old fallback clips are used.

voices:
  narrator: motion_narrator        # every one-narrator reel
  host: motion_host                # the asking role in every two-speaker reel
  character_1: motion_char_1       # the brighter / higher character voice
  character_2: motion_char_2       # the deeper / lower character voice

# The shared host of every two-speaker reel (interviewer, peer, student): a
# neutral grey identity, so the language speaker is the only colour on screen.
host:
  name: Host
  colour: "#6C6F7A"
  symbol:
    - {rect: [36, 12, 28, 46], r: 14}
    - {path: "M24 44 C24 66 76 66 76 44", stroke: 8}
    - {rect: [46, 64, 8, 18], r: 3}
    - {rect: [32, 80, 36, 8], r: 4}

