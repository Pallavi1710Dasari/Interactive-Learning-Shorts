<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learning Shorts</title>

    <!-- The display faces the reading material teaches with, so a "preview" frame
         showing `font-family: "Lobster"` renders in Lobster instead of silently
         falling back to the default sans. A frame that claims to show a typeface
         and shows a different one is worse than no frame: the viewer is being told
         to look at a difference that is not on screen.

         This list mirrors the @import in the CSS cheatsheets under output/uploads.
         Anything outside it — plus the generic families, which always work — is not
         offered to the model; see WEB_SAFE_FONTS in shorts/skills/layout.py. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700&family=Roboto:ital,wght@0,100;0,400;0,700;0,900;1,400&family=Source+Sans+3:ital,wght@0,400;0,700&family=Work+Sans:ital,wght@0,400;0,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
