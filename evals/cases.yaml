    name: A table's header and separator rows are never counted as facts on their own
    why: >
      The failure half of E081. Without this, the cheap way to make a table
      "count" is to treat every line of it as a span — header and separator
      included — which would let a table with real STRUCTURE but no real DATA
      (or, as here, data too sparse to cite) pass richness on the strength of
      its own scaffolding. This section has one genuine sentence and a table
      whose only data row ("x", "y") flattens to two characters, under
      MIN_QUOTE_CHARS — so it must still fail with only one real span, proving
      the header and the `|---|---|` separator were not silently counted as
      two more.
    type: golden
    step: section_richness
    input: evals/fixtures/sparse_table_material.md
    section_id: "a_table_whose_data_rows_are_too_sparse_t"
    expect:
      passed: false
      reason_contains: "distinct citable sentence"

