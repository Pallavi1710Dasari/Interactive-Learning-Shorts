# ============================================================================
# THE EVAL SET
#
# Every case is a real failure someone actually hit, frozen so it can never
# come back. Re-run this file before every prompt change and before every merge.
#
# Case types:
#   code_grader  - deterministic. Runs offline, free, in milliseconds.
#   llm_judge    - needs meaning. Costs an API call. Run less often.
#   golden       - a known-good output. Regression guard.
#
# Grow this file every time something breaks in production. That is the whole
# self-evolving loop: bug -> eval case -> prompt fix -> case passes forever.
# ============================================================================

version: 1
source_doc: content/session_18_paging.md

cases:

  # ---------------------------------------------------------------- code graders

  - id: E001
    name: A rambling script is rejected for length
    why: "First real failure. Model ignored the word budget and wrote a 3-minute script."
    type: code_grader
    grader: timing
    fixture: evals/fixtures/too_long.json
    expect:
      passed: false
      reason_contains: "too long"

  - id: E002
    name: A thin script is rejected for being too short
    why: "Model over-corrected after we tightened the length prompt and wrote 12 words."
    type: code_grader
    grader: timing
    fixture: evals/fixtures/too_short.json
    expect:
      passed: false
      reason_contains: "too short"

  - id: E003
    name: A well-sized script passes the timing gate
    why: "Guards against a fix that rejects everything."
    type: code_grader
    grader: timing
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: true

  - id: E004
    name: Overlay text longer than 8 words is rejected
    why: "Reviewer found on-screen text spilling off a phone screen in short 3."
    type: code_grader
    grader: overlays
    fixture: evals/fixtures/overlay_too_wordy.json
    expect:
      passed: false
      reason_contains: "over 8 words"

  - id: E005
    name: A one-block answer is rejected — split it so visuals can change
    why: >
      This case has now been inverted TWICE, so read before changing it again.
      Originally: answers had to be split across 2-6 beats. Then the format moved
      to a single continuous answer and this case was flipped to reject split
      answers. Review rejected that: one long answer read as a wall of text, held
      one diagram on screen for ~40 seconds, and drifted off the source. So the
      rule is back to a split answer.

      THE FLOOR IS NOW 4, and this expectation tracks it. The history matters: the
      floor was 3, then 2, and this case sat red for months asking for "at least 3"
      while the grader said "at least 2" — a red eval nobody can act on teaches
      people to ignore the suite. So the number here is deliberately kept identical
      to what check_dialogue_shape prints, and it moves in the same commit as
      MIN_ANSWERS every time.

      It reads 4 because the window moved to 35-50s (schema.MIN_SECONDS). The extra
      beats are NOT extra claims: they are a worked example, a corrected
      misconception and a closing takeaway, which is what the length is for. The
      thing keeping this from being the 2019 wall of text is MAX_ANSWER_WORDS
      holding at 24, not the beat count.

      E011 is the success half. Change dialogue_shape and both cases together.
    type: code_grader
    grader: dialogue_shape
    fixture: evals/fixtures/single_answer.json
    expect:
      passed: false
      reason_contains: "at least 4"

  - id: E011
    name: A 4-5 beat answer with short beats is accepted
    why: >
      The success half of E005. Without it, the cheapest way to make dialogue_shape
      green is to reject every shape, and the pair is what stops that.

      Its fixture is also the suite's only all-graders-green script, so it doubles
      as the shape the 35-50s window is supposed to produce: 5 answer beats, none
      over 24 words, a misconception beat and a takeaway among them, and 4 distinct
      citations rather than one sentence stretched five ways.
    type: code_grader
    grader: dialogue_shape
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: true

  - id: E006
    name: Content invented outside the source section is caught
    why: "Model added Linux hugepage details and a fake Google benchmark. Nothing in the doc."
    type: code_grader
    grader: grounding
    section_id: "3.5"
    fixture: evals/fixtures/hallucinated.json
    expect:
      passed: false
      reason_contains: "appear in the source"

  - id: E007
    name: A grounded script passes the grounding check
    why: "Guards against a grounding threshold set so high nothing passes."
    type: code_grader
    grader: grounding
    section_id: "3.3"
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: true

  - id: E012
    name: An answer citing a sentence not in the section is caught
    why: >
      The failure grounding cannot see. Beat 2 uses the section's own vocabulary to
      state something the section never says — an LRU swap priority table — and
      cites a sentence that does not exist. Word-overlap grounding passes it,
      because every word in it is a word the material uses elsewhere; a confident,
      on-topic, wrong answer is the one that actually reaches a learner. E013 is
      the success half. Change check_source_quotes and both cases together.
    type: code_grader
    grader: source_quotes
    section_id: "3.3"
    fixture: evals/fixtures/fabricated_quote.json
    expect:
      passed: false
      reason_contains: "not in the material"

  - id: E013
    name: Answers that quote the section verbatim are accepted
    why: >
      The success half of E012. Without it the cheapest way to make source_quotes
      green is to reject every citation. Also guards the whitespace handling: the
      quotes in this fixture span a line break in the source, and a matcher that
      does not collapse whitespace fails all four of them.
    type: code_grader
    grader: source_quotes
    section_id: "3.3"
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: true

  - id: E014
    name: A script that refuses to answer is rejected
    why: >
      Shipped to a reviewer on a real HTML document. The doc numbered its FAQ
      subsections "### 1..4" under top-level sections "## 1..4", so "### 3. What are
      header and heading elements" collided with "## 3. Paragraph Element" and
      find_section returned the paragraph one. The writer, obeying the stay-inside-
      the-source rule, correctly refused — "the section I have only talks about the
      p element" — and that reached the review page as a finished card.

      Two fixes, and this case guards the second: parse_markdown now makes section
      ids unique, and a refusal can never again pass the graders. E015 is the
      success half.
    type: code_grader
    grader: no_refusal
    fixture: evals/fixtures/refusal.json
    expect:
      passed: false
      reason_contains: "refuses to answer"

  - id: E015
    name: A normal teaching answer is not mistaken for a refusal
    why: >
      The success half of E014. The refusal patterns match phrases about the source
      material, and a grader that fired on ordinary negations ("the process is
      blocked", "it is not an error") would reject good scripts and be worse than
      no grader at all.
    type: code_grader
    grader: no_refusal
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: true

  - id: E016
    name: One sentence stretched across three beats is rejected
    why: >
      What the 30-second length floor was producing. A question whose honest answer
      is one sentence got inflated to fill the time, and the extra beats restated
      the same sentence — every claim verbatim-cited, every grader green, and
      nothing taught after beat 1.

      THIS CASE MATTERS MORE NOW THAN WHEN IT WAS WRITTEN. It was added when the
      floor came down to 18s, where a short answer was allowed to be short and the
      padding pressure was largely off. The floor is now 35s, which puts that
      pressure back on deliberately — so this grader is once again the main thing
      standing between a wider window and the defect the wider window used to
      cause. If it ever goes green by being relaxed, the 35s floor is unsafe.

      Whether a citation SUPPORTS its beat is a meaning question and belongs to the
      judge. How many distinct sentences the answer rests on is countable, and it
      is the shape padding always has. E013 is the success half.
    type: code_grader
    grader: source_quotes
    section_id: "3.4"
    fixture: evals/fixtures/one_idea_stretched.json
    expect:
      passed: false
      reason_contains: "distinct sentence"

  - id: E017
    name: An answer that never quotes its own section is rejected
    why: >
      An answer may only be built from the section the short is filed under. It used
      to be enough for ONE beat to quote that section, which let a three-beat short
      pass with two beats taught out of neighbouring material — and that is the shape
      four shipped shorts had when the judge scored them faithfulness 2 of 5, each
      for teaching a fact its own section does not contain. Now every answer beat has
      to be anchored. Graded against 3.1, which the page-fault fixture never quotes.
    type: code_grader
    grader: on_topic
    section_id: "3.1"
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: false
      reason_contains: "not supported by this short's own section"

  - id: E018
    name: An answer grounded in its own section passes the anchor
    why: >
      The success half of E017 — same fixture, graded against the section it is
      actually about. Without this pair the cheapest way to make on_topic green is
      to reject everything.
    type: code_grader
    grader: on_topic
    section_id: "3.3"
    fixture: evals/fixtures/good_page_fault.json
    expect:
      passed: true

  # ------------------------------------------------------------- frames (unit)
  #
  # These grade a whole ShortUnit rather than a Script, because the defect is in the
  # PICTURE. The harness could not load a unit until now, which is why the frame
  # graders had no cases — and a grader with no case behind it is how all four of
  # them ended up wired to nothing while 11 of 15 shipped shorts failed one.

  - id: E019
    name: Four frames that only move the highlight are rejected
    why: >
      The reviewer's words: "most of the slide is getting the same image". Frozen
      from what_is_http_and_what_does_it_do as it shipped — three frames of the same
      three glyphs with only the amber hero moving between them. Nothing is added,
      removed or replaced, so a viewer reads everything on screen in two seconds and
      then watches a still image for the rest of the short. check_frames_develop
      already said exactly this and its own docstring said "This reports, it does
      not gate"; skills/visuals.design_visuals is what now acts on it. E020 is the
      success half.
    type: unit_grader
    grader: frames_develop
    fixture: evals/fixtures/repeated_icon_frames.json
    expect:
      passed: false
      reason_contains: "the same picture twice"

  - id: E020
    name: Frames that change between beats are accepted
    why: >
      The success half of E019. Without it the cheapest way to make frames_develop
      green is to reject every composition, which would take out the legitimate case
      the whole "one composition that builds" design exists for.
    type: unit_grader
    grader: frames_develop
    fixture: evals/fixtures/developing_frames.json
    expect:
      passed: true

  - id: E021
    name: A glyph labelled HTTP drawn as a capital A is rejected
    why: >
      The reviewer's words: "if any image not able to display then it simply showing
      A". No image failed. `text` is a real pictogram, it draws a capital A, and the
      model reached for it whenever a label named something abstract — because the
      icon list had no server, no network, no lock. A capital A captioned "HTTP"
      tells a learner, in a picture, that HTTP is a letter of the alphabet.

      Two halves to the fix and this case guards the second: layout.PICTOGRAMS gained
      fourteen entries so the label has a picture, and check_icons_are_pictures fails
      `text` on anything that is not typography and `box` anywhere at all. E022 is
      the success half — a capital A IS the right drawing for a short about fonts.
    type: unit_grader
    grader: icons_are_pictures
    fixture: evals/fixtures/repeated_icon_frames.json
    expect:
      passed: false
      reason_contains: "CAPITAL A"

  - id: E022
    name: Pictograms that draw what they name are accepted
    why: >
      The success half of E021. The grader must not fire on `text` used honestly —
      three shipped shorts label it "Text", which a capital A is a correct picture
      of — nor on the fourteen new pictograms, which is the whole point of adding
      them.
    type: unit_grader
    grader: icons_are_pictures
    fixture: evals/fixtures/developing_frames.json
    expect:
      passed: true

  - id: E023
    name: A hierarchy drawn as a flat row of peers is rejected
    why: >
      The exact frame the visual brief quotes as the worst thing this pipeline has
      shipped: "Users, Applications, Operating System, Hardware" as four pictograms
      side by side. Every existing grader passes it — the labels come from the
      narration, the pictograms draw what they name, the frames differ — and the
      arrangement says the four are peers standing in a line, which is the opposite
      of what the beat says. Only the reading order of four words carried the truth.

      It was unenforceable until skills/strategy.py wrote the relationship down.
      Rules 6 to 10 are all "if the concept describes X, the visual must do Y", and
      nothing had ever decided what X was. With `relationship: hierarchy` on the
      beat it is a set membership test that costs nothing. E024 is the success half.
    type: unit_grader
    grader: frames_match_strategy
    fixture: evals/fixtures/hierarchy_as_row.json
    expect:
      passed: false
      reason_contains: "planned as a 'hierarchy' claim"

  - id: E024
    name: The same claim drawn as a stack is accepted
    why: >
      The success half of E023, and the reason layout.py gained a `hierarchy`
      template rather than the grader just banning `icons`. Rejecting a shape is
      only useful if there is a right shape to move to — the stack puts the claim
      in the geometry, so it survives having its labels deleted, which is rule 3.
    type: unit_grader
    grader: frames_match_strategy
    fixture: evals/fixtures/hierarchy_as_stack.json
    expect:
      passed: true

  - id: E025
    name: A frame that marks every element as the hero is rejected
    why: >
      "A composition of equal parts has no focus" has been in the brief from the
      start and nothing had ever checked it. Measured across the 38 units in
      output/, 18 had at least one frame with no accent at all or with the accent on
      everything — this fixture is the second kind, frozen from tlb_purpose as it
      shipped: two flow steps, both hero. An accent that is universal is not an
      accent, so the viewer has nothing to look at first.

      Deliberately ALL and not SEVERAL. Several heroes in one group is right far
      more often than it is wrong — lighting the three scattered "Free" cells of a
      memory bar is one claim about a category, and lighting only one of them would
      state it falsely. E026 is the success half.
    type: unit_grader
    grader: one_hero_per_frame
    fixture: evals/fixtures/accent_on_everything.json
    expect:
      passed: false
      reason_contains: "accent on everything is an accent on nothing"

  - id: E026
    name: A frame with a single clear focus is accepted
    why: >
      The success half of E025. Without it the cheapest way to make the grader green
      is to reject every frame that has more than one role in play, which would take
      out the mapping frames whose hero is a CORRESPONDENCE — "page 1 lives in frame
      9" needs both of its ends lit, and dimming either draws an arrow from a
      highlighted box to an unremarkable one.
    type: unit_grader
    grader: one_hero_per_frame
    fixture: evals/fixtures/developing_frames.json
    expect:
      passed: true

  - id: E027
    name: A frame labelled with words nobody says is rejected
    why: >
      The most expensive real failure this project has. closure_definition scored
      5/5/5 on faithfulness, clarity and pace and was still quarantined, because its
      opening frame was titled "Lexical Scope" and labelled a node "Inner function" —
      both correct JavaScript, neither ever spoken in the short or written in the
      section. dot_vs_bracket_notation failed the same way with "SyntaxError". The
      brief has forbidden this from the start and it was violated in 20% of shipped
      units, so the rule needed a case behind it rather than another paragraph.
    type: unit_grader
    grader: diagram_matches_narration
    fixture: evals/fixtures/labels_off_narration.json
    expect:
      passed: false
      reason_contains: "in neither the narration nor the source"

  - id: E028
    name: A frame labelled from the narration is accepted
    why: >
      The success half of E027. The cheap way to make that grader green is to reject
      any frame carrying a word the narration does not contain verbatim, which would
      fail every correctly-drawn diagram in output/ — the labels here are the words
      the short actually speaks.
    type: unit_grader
    grader: diagram_matches_narration
    fixture: evals/fixtures/labels_from_narration.json
    expect:
      passed: true



  # ------------------------------------------------------- content understanding
  #
  # Steps 3-10 added a planning step in front of the script and six graders behind
  # it, and none of them could be run from here: the harness loaded a Script and
  # nothing else, so every check that decides whether a short TEACHES was invisible
  # to CI. These cases close that, and they follow the same rule as everything
  # above — the graders are imported from shorts/checks.py, never reimplemented.
  #
  # Each fixture pairs an understanding with the script written from it, because a
  # script is only wrong RELATIVE to the plan it was handed.

  - id: E029
    name: A teaching sequence that leaves its own section is rejected
    why: >
      The quarantine that protects everything downstream. The reading is asked for
      a teaching order and a familiar topic has a familiar order in the model's
      head — one that is not this section's. A step naming TLB shootdown on a
      section about address translation would be handed to the script step as a
      plan to follow, with the authority of a plan.
    type: understanding_grader
    grader: teaching_sequence
    section_id: "3.2"
    fixture: evals/fixtures/understanding_unsupported_sequence.json
    expect:
      passed: false
      reason_contains: "not in the section's vocabulary"

  - id: E030
    name: A faithful script that never reaches the core idea is rejected
    why: >
      The veto, and the reason step 9 exists. Every beat here is cited verbatim to
      its own section, the length is right, the shape is right — and the short
      explains what contiguous allocation REQUIRES and never that paging makes the
      scattered memory usable. Every technical grader passes it. A short can be
      correct in every particular and teach nothing.
    type: content_grader
    grader: reaches_objective
    section_id: "3.1"
    fixture: evals/fixtures/content_misses_objective.json
    expect:
      passed: false
      reason_contains: "covers only"

  - id: E031
    name: The learning outcome fails on the objective alone
    why: >
      The same fixture read at the outcome level. This pins WHICH requirement broke,
      so a future change that fails this short for a different reason — grounding,
      say — is caught as a regression rather than passing as a green FAIL.
    type: content_grader
    grader: learning_outcome
    section_id: "3.1"
    fixture: evals/fixtures/content_misses_objective.json
    expect:
      passed: false
      reason_contains: "does not yet teach"
      requirements:
        objective_reached: false
        teaching_sequence_covered: true
        required_example_satisfied: true
        required_confusion_satisfied: true

  - id: E032
    name: Planned concepts explained in reverse order are rejected
    why: >
      The order IS the plan. Every beat here is true, cited, and on the section;
      they are simply in the wrong sequence, so the viewer is shown the physical
      address being formed before being told an address has two parts. Coverage
      alone would pass this, which is why the order rule is separate.
    type: content_grader
    grader: follows_sequence
    section_id: "3.2"
    fixture: evals/fixtures/content_wrong_teaching_order.json
    expect:
      passed: false
      reason_contains: "out of order"

  - id: E033
    name: A required worked example that never appears is rejected
    why: >
      "required" means the idea does not land without the worked case. The example
      was the first thing dropped whenever the beats got tight, because before the
      plan existed it was advisory — a bag of nouns with nothing saying whether
      this short is one where the example IS the explanation.
    type: content_grader
    grader: uses_example
    section_id: "3.2"
    fixture: evals/fixtures/content_example_missing.json
    expect:
      passed: false
      reason_contains: "never uses the required example"

  - id: E034
    name: A required example used far from its own step is rejected
    why: >
      The half that is easy to miss. The example is present, copied correctly, and
      three beats away from the idea it exists to make concrete — which is
      decoration. A presence check alone would pass this.
    type: content_grader
    grader: uses_example
    section_id: "3.2"
    fixture: evals/fixtures/content_example_misplaced.json
    expect:
      passed: false
      reason_contains: "belongs to step 2"

  - id: E035
    name: A misconception spoken as fact is rejected
    why: >
      The worst outcome the pipeline can produce: the short says the wrong thing
      in the student's voice and corrects it in the NEXT beat, by which time the
      viewer has heard it. Beat 3 here is correct, and that is exactly why this
      case is frozen — a neighbour-window check passed it, and a viewer would not.
    type: content_grader
    grader: handles_confusion
    section_id: "3.3"
    fixture: evals/fixtures/content_confusion_as_fact.json
    expect:
      passed: false
      reason_contains: "as if it were true"

  - id: E036
    name: A manufactured common mistake under not_needed is rejected
    why: >
      The brief says a question aimed at a misconception is the best kind, so a
      list of confusions reads as an instruction to find one. That is how a short
      acquires a "common mistake" beat about a mistake nobody makes — warning a
      viewer off an error they were never going to commit, with the beat that
      should have explained the thing.
    type: content_grader
    grader: handles_confusion
    section_id: "3.3"
    fixture: evals/fixtures/content_manufactured_misconception.json
    expect:
      passed: false
      reason_contains: "opens a misconception"

  - id: E037
    name: A grounded hook that hands over to nothing is rejected
    why: >
      The hook is real, on the page, and well aimed — and the answer then restates
      the constraint instead of resolving it, so the opening is a disconnected
      introduction. Grounding alone cannot catch this: every word is in the section.
    type: content_grader
    grader: opening_hook
    section_id: "3.1"
    fixture: evals/fixtures/content_hook_strays.json
    expect:
      passed: false
      reason_contains: "never hands over to the objective"

  - id: E038
    name: Quarantined plans skip cleanly instead of failing the short
    why: >
      The rule that keeps the whole planning layer safe to fail. When a plan is
      dropped by its own validator the script step gets no guidance for it — and
      absent guidance must never be read as evidence against the script. If this
      case ever fails, a quarantine has started rejecting good shorts, which is
      worse than the bad plan it was protecting against.
    type: content_grader
    grader: follows_sequence
    section_id: "3.1"
    fixture: evals/fixtures/content_quarantined_plans.json
    expect:
      passed: true
      skipped: true
      reason_contains: "skipped"

  - id: E039
    name: A quarantined understanding still passes the learning outcome
    why: >
      E038 at the outcome level. Four requirements are unavailable and the veto
      still runs — a short with no surviving plan is judged on whether it reaches
      its objective, and nothing else.
    type: content_grader
    grader: learning_outcome
    section_id: "3.1"
    fixture: evals/fixtures/content_quarantined_plans.json
    expect:
      passed: true
      reason_contains: "not applicable"
      requirements:
        objective_reached: true

  - id: E040
    name: A short meeting every learning requirement passes
    why: >
      The positive control for the whole content layer, and the case that stops the
      cheap fix. Every grader added in steps 5-9 can be made green by tightening it
      until it rejects everything; this short is what the pipeline is TRYING to
      produce, and it has to survive all of them at once.
    type: content_grader
    grader: learning_outcome
    section_id: "3.2"
    fixture: evals/fixtures/content_all_requirements_met.json
    expect:
      passed: true
      requirements:
        objective_reached: true
        teaching_sequence_covered: true
        required_example_satisfied: true
        required_confusion_satisfied: true
        opening_leads_into_learning: true
        source_grounding_satisfied: true

  - id: E041
    name: A revision brief fixes one area and preserves the rest
    why: >
      Retries used to chase each other around the script: an attempt fixed the
      cited beat and rewrote the opening that was already working, and the next
      attempt failed on the opening. The brief has to name the survivors as things
      to keep. This freezes both halves — only `example` under Fix, and everything
      that really passed under Preserve.
    type: revision
    section_id: "3.2"
    fixture: evals/fixtures/content_example_missing.json
    expect:
      fix_areas: ["example"]
      preserve_areas: ["grounding", "teaching_flow", "opening", "confusion", "other"]
      block_contains:
        - "WHAT IS WRONG"
        - "WHAT TO FIX"
        - "WHAT TO PRESERVE"
        - "Keep WHAT THEY DO"
      block_excludes:
        - "learning_outcome"
        - "exact wording"
        - "word-for-word"

  - id: E042
    name: A revision brief never names a plan that was quarantined
    why: >
      Naming the missing plan would invite the script step to reconstruct it, which
      is the invention the quarantine existed to prevent. Absent guidance is silent
      guidance: the short is re-written with what survived and told nothing about
      what did not.
    type: revision
    section_id: "3.1"
    fixture: evals/fixtures/content_quarantined_plans.json
    expect:
      fix_areas: []
      block_excludes:
        - "uses_example"
        - "handles_confusion"
        - "opening_hook"


  # --------------------------------------------------------- beats that go nowhere
  #
  # Found in shipped output, not in a fixture someone imagined. Every grader in
  # this file asked about ONE beat, so a script could say the same thing twice and
  # score 13 out of 13 — and check_source_quotes made it worse by demanding a
  # DISTINCT citation per beat, which the model satisfies by pointing at a new
  # sentence while saying the old thing.
  #
  # The three PASS cases matter as much as the three FAIL ones: the cheap way to
  # make this grader green is to fail any beat that reuses a noun, which would
  # reject every honest explanation of a single idea.

  - id: E043
    name: A beat that repeats an earlier one word for word is rejected
    why: >
      The floor. Nothing in the pipeline noticed an exact duplicate answer beat —
      not the graders, not the API, not the review UI — because every check was
      per-beat and the two beats carried different source quotes. This is also the
      shape the offline stub generated for a while, which is how it was found.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/repeat_exact_narration.json
    expect:
      passed: false
      reason_contains: "restates beat 1"

  - id: E044
    name: The same explanation in different words is rejected
    why: >
      The real shape of the defect. An exact duplicate is easy; what the model
      actually produces is the same claim reworded — "paging removes the
      requirement for contiguity" then "paging drops the contiguity requirement".
      Both cite different sentences, both are true, and the second teaches nobody
      anything. This case is why the grader measures NOVELTY rather than string
      similarity.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/repeat_reworded.json
    expect:
      passed: false
      reason_contains: "restates beat 2"

  - id: E045
    name: The shipped recap beat is rejected
    why: >
      The actual bug, frozen from output/html_doc_basic_structure.json exactly as
      the pipeline produced it. Beat 4 is beat 1 with the words moved — the "so in
      summary" beat the script brief explicitly says to delete — and it spent a
      quarter of the video. It passed all thirteen graders.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/repeat_shipped_recap.json
    expect:
      passed: false
      reason_contains: "restates beat 1"

  - id: E046
    name: Shared technical vocabulary is not mistaken for repetition
    why: >
      The case that stops the cheap fix. "Page number", "frame" and "offset" recur
      through this answer because the subject recurs, and every beat advances the
      translation by one step. A similarity check fails this; a novelty check
      passes it. Without this case the grader would be tightened until it rejected
      every faithful explanation of one mechanism.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/develops_shared_vocabulary.json
    expect:
      passed: true

  - id: E047
    name: A conclusion that lands the payoff is not repetition
    why: >
      The last beat is SUPPOSED to reuse the short's vocabulary — check_reaches_
      objective requires it to land the core idea, and the brief requires it to
      answer the question. What makes it a real beat rather than a recap is that it
      adds the consequence: the gaps become usable and the fragmentation
      disappears. Two graders pull in opposite directions here and this case pins
      the line between them.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/develops_conclusion.json
    expect:
      passed: true

  - id: E048
    name: Two adjacent teaching steps about one process both survive
    why: >
      Consecutive steps of a mechanism share their subject by construction — every
      beat here is about the page fault, the OS and the page table. They are three
      distinct events in one sequence, and a grader that cannot tell "the next step
      of this process" from "the previous step again" would make the teaching
      sequence unimplementable.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/develops_adjacent_steps.json
    expect:
      passed: true
  - id: E050
    name: A reading too thin for 35-50s is flagged before a script is written
    why: >
      The other half of the length change, and the half that has teeth. E049
      asserts a too-SHORT script is rejected; this asserts the pipeline can see
      the cause coming — a section with two teaching steps, no example and no
      misconception has about two ideas in it, and a 4-5 beat short built on it
      fills the remaining beats by restating.

      It replaced Topic.depth. That field recorded the same judgement from
      select, unvalidated, duplicated across topics sharing a section, and read by
      nothing; this asks the question once, off the validated reading. Do not
      re-add a depth field to Topic without deleting this case, or the two will
      drift and the unvalidated one will look authoritative.

      Section 3.5 is the honest example, not a contrived one: it is 47 words and
      genuinely does not support a 45-second short.
    type: understanding_grader
    grader: plan_depth
    section_id: "3.5"
    fixture: evals/fixtures/understanding_thin_for_window.json
    expect:
      passed: false
      reason_contains: "thin for a"

  - id: E051
    name: A reading with real depth passes the window check
    why: >
      The success half of E050. Without it the cheap way to make plan_depth green
      is to flag every reading, which would make the check noise and get it
      ignored — and it reuses the fixture that already models a reading with
      every requirement met, whose section does support a 45-second short.
    type: understanding_grader
    grader: plan_depth
    section_id: "3.2"
    fixture: evals/fixtures/content_all_requirements_met.json
    expect:
      passed: true

  - id: E049
    name: A concise but complete 29-second short ships
    why: >
      THE CASE THAT RECORDS WHY THE FLOOR CAME DOWN, and it is deliberately the
      inversion of what stood here before. This slot used to hold a 26.4-second
      script asserted to FAIL, as the regression guard for a 35-50s window.

      That window was wrong, and it was measurement that showed it rather than
      argument. Four real runs against a document written specifically to be rich
      enough for 45 seconds produced scripts of 67, 77 and 71 words — mean 28.7
      seconds — most of them passing every other grader. One opened by correcting
      the misconception, scored both of the section's real selectors verbatim, and
      landed the consequence. It was a good short whose only fault was being 28
      seconds long.

      So the fixture here is a real 29-second short and its job is to PASS every
      grader: four beats, one idea each, four distinct citations, 90% grounded,
      nothing restated. If it ever fails on length, the floor has crept back up and
      the format has started rejecting finished work again.

      Its partner is E045, not a failure case of its own: E045 holds a padded
      32-second short and rejects it on REPETITION. Together they say the thing
      this window change rests on — length is not what tells a good short from a
      padded one, and the graders that do tell them apart are unchanged.
    type: code_grader
    grader: timing
    fixture: evals/fixtures/concise_but_complete.json
    expect:
      passed: true

  - id: E052
    name: The concise short is concise, not padded
    why: >
      The other half of E049, and the reason it is a separate case. Passing timing
      only proves the 29-second short is allowed; this proves it deserves to be —
      no beat restates another, so its brevity is economy rather than a short
      script with the padding removed.

      Without this pair, the cheap way to satisfy E049 is to lower the floor and
      let anything short through.
    type: code_grader
    grader: no_repetition
    fixture: evals/fixtures/concise_but_complete.json
    expect:
      passed: true

  - id: E053
    name: A four-beat answer at the bottom of the range keeps its shape
    why: >
      The third assertion on the same fixture, because "short" must not become a
      licence to drop beats. MIN_ANSWERS is unchanged at 4 — the window moved, the
      structure did not — so a 29-second short still owes four one-idea beats, and
      this fails if someone tries to make the floor reachable by allowing three.
    type: code_grader
    grader: dialogue_shape
    fixture: evals/fixtures/concise_but_complete.json
    expect:
      passed: true


  # -------------------------------------------------- visual progression
  #
  # These replace the coverage check_frames_vary_template never had, and they
  # exist because that grader was measuring the wrong thing. It answered "is this
  # short repetitive?" by counting distinct TEMPLATES, which fails a persistent
  # scaffold whose contents change every beat — the shape a process, a comparison
  # and a data structure are actually taught in — and passes four rows of
  # pictograms as long as one card among them is a different layout.
  #
  # The rule these freeze is the one that matters: the same template with real
  # state changes is good, the same template with a sliding accent is not, and a
  # different template is not by itself worth anything.

  - id: E054
    name: One scaffold whose contents change every beat is visual progression
    why: >
      The case the rewrite exists for, taken from a real rendered reel. Five
      `compare` frames under one constant title, the two columns holding "Target
      element", then "Scoreboard", then the three score components, then the two
      real scores, then the winner lit and the loser dimmed. One template, five
      different pictures, one idea developed — and the old template-counting
      grader called it "one layout repeated".
    type: unit_grader
    grader: frames_progress
    fixture: evals/fixtures/visual_scaffold_progresses.json
    expect:
      passed: true

  - id: E055
    name: One scaffold with only the accent moving is not
    why: >
      The failure half, and the reason E054 cannot be satisfied by disabling the
      check. Same template, same three labels in every frame, only which one is
      amber changes. A viewer reads the whole picture in two seconds and then
      watches a highlight slide over it — the original complaint, word for word.
      Template count cannot tell this apart from E054; drawn content can.
    type: unit_grader
    grader: frames_progress
    fixture: evals/fixtures/visual_scaffold_static.json
    expect:
      passed: false
      reason_contains: "only the accent moves"

  - id: E056
    name: A payoff beat that re-roles an assembled picture is allowed
    why: >
      frames_develop used to fail ANY transition that only moved the accent. The
      last beat of E054's fixture keeps both scores on screen and re-roles them —
      winner to hero, loser to lost, tied rows to quiet. That is the climax, and
      nothing new is drawn because nothing new is needed.

      The rule is now proportional: one such transition in three or more is a
      payoff, two in three is a short standing still. E019 holds the failure side.
    type: unit_grader
    grader: frames_develop
    fixture: evals/fixtures/visual_scaffold_progresses.json
    expect:
      passed: true

  - id: E057
    name: A genuine two-subject comparison keeps both subjects lit
    why: >
      one_hero_per_frame counts heroes WITHIN each group, not per frame, so a claim
      that spans two columns can light both of its ends — "this selector brings an
      id and that one brings none" is one claim needing two accents, and dimming
      either end draws an arrow from a highlighted box to an unremarkable one.

      Frozen because it is the case a well-meaning tightening breaks. E025 holds
      the real defect this grader is for, which is a group where EVERY element is
      hero — six boxes all amber, an accent on everything and so on nothing.
    type: unit_grader
    grader: one_hero_per_frame
    fixture: evals/fixtures/visual_comparison_two_subjects.json
    expect:
      passed: true

  - id: E058
    name: A worked-example frame may print the literals its beat names
    why: >
      frames_are_visual measures how much of a spoken line is reproduced in the
      frame, and it was counting the wrong words. The beat "So `#nav .item a`
      counts to 1,1,1, while `.item .link a` counts to 0,2,1" against a frame whose
      columns are those two selectors and whose cells are those two scores echoed
      86% — and every shared word was a selector or a numeral, which is precisely
      what the picture must show for the example to be worked at all.

      The echo is now measured on the PROSE only. Literals and numerals are the
      subject, not the sentence.
    type: unit_grader
    grader: frames_are_visual
    fixture: evals/fixtures/visual_worked_example_literals.json
    expect:
      passed: true

  - id: E059
    name: A frame that prints the sentence's prose is still rejected
    why: >
      The failure half of E058, and the defect the grader was written for: labels
      like "allocation forces", "every process", "occupy unbroken" — the spoken
      line chopped into boxes. No literals involved, so excluding literals cannot
      rescue it. If this ever passes, the prose exclusion has been widened into a
      hole.
    type: unit_grader
    grader: frames_are_visual
    fixture: evals/fixtures/visual_frame_prints_sentence.json
    expect:
      passed: false
      reason_contains: "PROSE is printed"

  # ------------------------------------------------------------------ llm judge

  - id: E008
    name: Judge flags the fabricated hugepage script
    why: "The code grader catches it, but the judge must catch it too — subtler cases exist."
    type: llm_judge
    section_id: "3.5"
    fixture: evals/fixtures/hallucinated.json
    expect:
      faithfulness_max: 2
      passed: false

  - id: E009
    name: Judge approves the grounded page-fault script
    why: "A judge that fails everything is useless. This is the false-positive guard."
    type: llm_judge
    section_id: "3.3"
    fixture: evals/fixtures/good_page_fault.json
    expect:
      faithfulness_min: 4
      passed: true

  # --------------------------------------------------------------------- golden

  - id: E010
    name: Skill 1 still selects the page fault path from session 18
    why: "Topic selection silently drifted after a prompt edit and dropped the core concept."
    type: golden
    step: select
    input: content/session_18_paging.md
    expect:
      must_include_sections: ["3.2", "3.3"]
      topic_count_between: [4, 6]


# ============================================================================
# RUBRIC — what the LLM judge scores, 1 to 5. Keep the wording stable; changing
# a rubric invalidates every historical score you have logged.
# ============================================================================

rubric:
  faithfulness:
    5: "Every claim is stated in or directly implied by the source section."
    4: "Every claim traces to the source; one minor rewording is looser than ideal."
    3: "One claim is plausible but not actually present in the section."
    2: "Multiple claims are not in the section, or a specific number/name is invented."
    1: "The script is substantially about something the section does not cover."

  clarity:
    5: "A learner who has not read the doc understands it on first listen."
    4: "Clear, one sentence could be tighter."
    3: "Understandable but requires re-listening."
    2: "Jargon used before it is defined."
    1: "Confusing or self-contradictory."

  pace:
    5: "Beats are evenly sized; no beat runs past ~12 seconds."
    4: "Slightly uneven but watchable."
    3: "One beat is noticeably long."
    2: "Beats are wildly uneven."
    1: "Effectively a monologue."

  diagram_correct:
    true: "Every diagram spec matches what the narration says at that moment and is technically accurate."
    false: "Any diagram contradicts the narration or is technically wrong."

pass_threshold:
  faithfulness: 4
  clarity: 4
  pace: 3
  diagram_correct: true
