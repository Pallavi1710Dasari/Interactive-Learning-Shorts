  # run.py's build_one, after select.py's topic and question are already locked
  # in, and nothing had ever compared the two. check_plan_depth grades whether
  # the reading found enough MATERIAL; these two cases are for the check that
  # asks a different question — is the topic even about the same THING the
  # reading landed on. Both fixtures share one section understanding — 4.2 of
  # content/css_specificity.md, "When specificity ties" — and differ only in
  # which topic is checked against it, so a change that starts flagging (or
  # stops flagging) the right one has broken the comparison itself rather than
  # picked a harder example.

  - id: E089
    name: A topic aimed at !important is rejected against the specificity-tie section
    why: >
      The real gap this closes. Section 4.2 is "When specificity ties" and its
      own validated core idea is that a tie is broken by DOCUMENT ORDER — the
      later rule wins. This topic is genuinely important and genuinely
      well-formed, and it is about a different section entirely: 4.3's
      !important flag, which overrides even an inline style. Filed under 4.2,
      it is exactly the drift the product owner complained about — "the
      questions... often do not focus on the main learning concept" — and nothing
      before this check would have caught it: it passes importance, the yes/no
      filter, the duplicate-concept filter and check_plan_depth without any of
      them ever reading understanding.core_idea against the topic at all.
    type: topic_grader
