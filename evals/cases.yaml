      worked example instead — a username check, then a password check, then a
      shared catch — which is exactly what the brief's own BE CONCRETE instruction
      asks for, and it does not reuse the objective's own abstract words
      (asynchronous, chaining, sequence, handles, multiple, passes, control) to say
      it. follows_sequence's FOCUS check failed it at 25% against a 30% floor.

      Two real defects, both fixed:
        1. A stemming bug. "failure" stemmed to "failur" (no rule stripped "-ure"),
           and _grounded's prefix-match requires both sides >=5 characters, so
           "fail" (4 chars, from "fail at any step") could never match it however
           related the words are.
        2. FOCUS scored only the student's beats, so "chain" — sitting right there
           in the INTERVIEWER'S QUESTION, one breath before the answer — did not
           count as vocabulary the short had established. A viewer does not need
           the answer to repeat a word the question just said.
      This fixture is the real content, reconstructed from the two real fixes
