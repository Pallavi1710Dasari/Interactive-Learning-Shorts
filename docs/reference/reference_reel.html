<style>

body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

.stage{position:relative;width:min(94vw,calc(84vh*9/16));width:min(94vw,calc(84dvh*9/16));aspect-ratio:9/16;border-radius:22px;overflow:hidden;

.cam{transition:transform .9s cubic-bezier(.6,.05,.25,1)}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

<script>
const NS='http://www.w3.org/2000/svg';
const C={ink:'#151936',sub:'#6A6F8E',line:'#E2E4EF',paper:'#F3F4F9',surf:'#FFFFFF',indigo:'#5B4BF5',indigoSoft:'#ECEAFE',amber:'#FFB524',amberSoft:'#FFF3D9',coral:'#F2555A',coralSoft:'#FDE8E8',mint:'#17B27B',mintSoft:'#E2F6EE',grey:'#B7BBD0',code:'#1B1F3B'};
const MONO='"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace', SANS='Manrope, system-ui, -apple-system, "Segoe UI", sans-serif';
const camEl=document.getElementById('cam'), world=document.getElementById('world'), defs=document.getElementById('defs');
const capEl=document.getElementById('cap'), segsEl=document.getElementById('segs'), overlay=document.getElementById('overlay');
let uid=0;
function el(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,a={}){const t=el('text',Object.assign({x,y,'font-family':SANS,fill:C.ink},a),p);t.textContent=s;return t;}
function restart(e,c){e.classList.remove(c);e.getBoundingClientRect();e.classList.add(c);}
function pop(e,d=0){e.style.animationDelay=d+'ms';restart(e,'pop');}
function grp(p){return el('g',{},p);}
function placed(p,x,y,s=1){const o=grp(p);const i=el('g',{transform:`translate(${x},${y}) scale(${s})`},o);return [o,i];}
function hide(e){e.style.opacity=0;return e;}
function reveal(e,d=0){e.style.opacity=1;pop(e,d);}
function cam(cx,cy,s){camEl.style.transform=`translate(180px,340px) scale(${s}) translate(${-cx}px,${-cy}px)`;}
function camReset(){camEl.style.transition='none';cam(180,340,1);camEl.getBoundingClientRect();camEl.style.transition='';}

const ICONS={heart:'M12 20.3s-7.4-4.5-9.2-9.1C1.6 7.9 3.7 4.6 7 4.6c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.3 0 5.4 3.3 4.2 6.6-1.8 4.6-9.2 9.1-9.2 9.1z',
  refresh:'M19.5 12a7.5 7.5 0 1 1-2.2-5.3 M19.5 4.5v4.8h-4.8',memory:'M4 4.5h16v6.5H4z M4 13h16v6.5H4z M8 7.75h.01 M8 16.25h.01 M12 7.75h4 M12 16.25h4',
  bolt:'M13.5 2.5 4.5 13.5h6.5l-1 8 9-11h-6.5z',check:'M5 12.5l4.2 4.2L19 7',x:'M7 7l10 10M17 7 7 17',tap:'M9 11V5.5a2 2 0 0 1 4 0V10l4.3 1a2 2 0 0 1 1.6 2.3l-.9 5.2a2 2 0 0 1-2 1.7H11a2 2 0 0 1-1.6-.8L6 14.8a1.6 1.6 0 0 1 2.4-2.1L9 13.3'};
function icon(p,n,x,y,size,col,fill='none',sw=2){const g=el('g',{transform:`translate(${x-size/2},${y-size/2}) scale(${size/24})`},p);
  el('path',{d:ICONS[n],fill,stroke:col,'stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round'},g);return g;}
function tile(p,n,x,y,size,bg,col){const [o,i]=placed(p,x,y);el('rect',{x:-size/2,y:-size/2,width:size,height:size,rx:size*.28,fill:bg},i);icon(i,n,0,0,size*.5,col);return o;}
function pill(p,x,y,str,{bg=C.indigoSoft,col=C.indigo,size=12,mono=false,ic=null}={}){
  const [o,i]=placed(p,x,y);const w=str.length*size*(mono?.62:.58)+(ic?40:24);
  el('rect',{x:-w/2,y:-size-3,width:w,height:size*2+6,rx:size+3,fill:bg},i);
  if(ic)icon(i,ic,-w/2+18,0,size*1.25,col);
  txt(i,ic?-w/2+30:0,size*.36,str,{'font-size':size,'font-weight':700,fill:col,'text-anchor':ic?'start':'middle','font-family':mono?MONO:SANS});return o;}
function bg(r,fill=C.paper){el('rect',{x:-400,y:-400,width:1200,height:1500,fill},r);
  const g=grp(r);for(let x=24;x<360;x+=24)for(let y=168;y<560;y+=24)el('circle',{cx:x,cy:y,r:.9,fill:C.grey,opacity:.45},g);}
function glow(p,x,y,r,col=C.amber){const g=el('circle',{cx:x,cy:y,r,fill:col,filter:'url(#blur)',opacity:0},p);g.style.transition='opacity .5s';return g;}

/* ---------- phone mockup with a social post ---------- */
function phone(p,cx,top){
  const w=176,h=336,l=cx-w/2;const [o,i]=placed(p,0,0);
  el('rect',{x:l,y:top,width:w,height:h,rx:32,fill:C.ink,filter:'url(#sh)'},i);
  el('rect',{x:l+7,y:top+7,width:w-14,height:h-14,rx:25,fill:C.surf},i);
  el('rect',{x:cx-26,y:top+14,width:52,height:14,rx:7,fill:C.ink},i);
  txt(i,l+22,top+56,'Feed',{'font-size':15,'font-weight':800});
  icon(i,'heart',l+w-28,top+51,15,C.ink);
  el('circle',{cx:l+30,cy:top+82,r:11,fill:'url(#av)'},i);
  txt(i,l+48,top+80,'rahul.codes',{'font-size':10.5,'font-weight':700});
  txt(i,l+48,top+92,'2 min ago',{'font-size':9,fill:C.sub,'font-weight':600});
  el('rect',{x:l+17,y:top+104,width:w-34,height:132,rx:14,fill:'url(#img)'},i);
  el('circle',{cx:l+w-50,cy:top+138,r:14,fill:C.amber,opacity:.9},i);
  el('path',{d:`M${l+17},${top+222} L${l+62},${top+172} L${l+92},${top+200} L${l+116},${top+180} L${l+w-17},${top+226} V${top+236} H${l+17}Z`,fill:C.indigo,opacity:.55},i);
  const hx=l+32,hy=top+258;
  const rip=el('circle',{cx:hx,cy:hy,r:16,fill:C.indigo,opacity:0},i);
  const hOut=grp(i);const hIc=icon(hOut,'heart',hx,hy,24,C.ink,'none',2);
  const cnt=txt(i,l+52,top+263,'0 likes',{'font-size':13,'font-weight':800});
  el('rect',{x:l+20,y:top+280,width:112,height:7,rx:3.5,fill:C.line},i);el('rect',{x:l+20,y:top+294,width:78,height:7,rx:3.5,fill:C.line},i);
  const fx=grp(i);
  const touch=el('circle',{cx:hx,cy:hy,r:15,fill:'#fff',stroke:C.ink,'stroke-width':2,opacity:0},i);touch.style.transition='opacity .15s';
  return {g:o,hx,hy,
    tap(){touch.style.opacity=.85;setTimeout(()=>touch.style.opacity=0,220);restart(rip,'ripple');restart(hOut,'pulse');},
    fail(){cnt.setAttribute('fill',C.coral);restart(cnt,'shake');setTimeout(()=>cnt.setAttribute('fill',C.ink),650);},
    set(n){cnt.textContent=n+(n===1?' like':' likes');cnt.setAttribute('fill',C.ink);restart(cnt,'pulse');
      hIc.firstChild.setAttribute('fill',C.coral);hIc.firstChild.setAttribute('stroke',C.coral);
      for(let k=0;k<3;k++){const [fo,fi]=placed(fx,hx+(k-1)*12,hy-8);icon(fi,'heart',0,0,11,C.coral,C.coral);fo.style.animationDelay=(k*80)+'ms';fo.classList.add('floatUp');}}};
}

/* ---------- component card (what React renders) ---------- */
function card(p,x,y,w,h,{val=0,code=null}={}){
  const [o,i]=placed(p,0,0);const id='clip'+(++uid);
  const cp=el('clipPath',{id},defs);el('rect',{x,y,width:w,height:h,rx:18},cp);
  el('rect',{x,y,width:w,height:h,rx:18,fill:C.surf,filter:'url(#sh)'},i);
  const inner=el('g',{'clip-path':`url(#${id})`},i);
  pill(inner,x+62,y+26,'<LikeButton />',{mono:true,size:11});
  const bdot=el('circle',{cx:x+w-78,cy:y+26,r:3.5,fill:C.mint},inner);
  const badge=txt(inner,x+w-70,y+30,'Render 1',{'font-size':11,'font-weight':700,fill:C.sub});
  el('line',{x1:x,y1:y+46,x2:x+w,y2:y+46,stroke:C.line,'stroke-width':1.5},inner);
  const body=grp(inner);body.style.transition='opacity .2s';
  txt(body,x+20,y+68,'On screen',{'font-size':10.5,'font-weight':700,fill:C.sub});
  const hIc=icon(body,'heart',x+32,y+92,24,C.coral,C.coral);
  const num=txt(body,x+54,y+102,String(val),{'font-size':30,'font-weight':800});
  txt(body,x+54+ (String(val).length*19)+6,y+101,'likes',{'font-size':12,'font-weight':700,fill:C.sub}).classList.add('lbl');
  let row=null,rowT=null,rowN=null;
  if(code!==null){row=el('rect',{x:x+14,y:y+h-44,width:w-28,height:32,rx:9,fill:C.paper},body);
    rowT=txt(body,x+26,y+h-23,code,{'font-size':12.5,'font-weight':600,'font-family':MONO});
    rowN=txt(body,x+w-26,y+h-23,'',{'font-size':10.5,'font-weight':700,fill:C.sub,'text-anchor':'end'});}
  const sw=el('rect',{x,y:y-70,width:w,height:70,fill:'url(#sweep)',opacity:0},inner);
  let n=1;
  return {g:o,
    display(v,col=C.ink){num.textContent=v;num.setAttribute('fill',col);restart(num,'pulse');},
    code(s,col=C.ink,note=''){if(!rowT)return;rowT.textContent=s;rowT.setAttribute('fill',col);rowN.textContent=note;
      row.setAttribute('fill',col===C.coral?C.coralSoft:col===C.amber||col==='#B37700'?C.amberSoft:col===C.indigo?C.indigoSoft:C.paper);restart(rowT,'pulse');},
    render(mid){n++;sw.style.transition='none';sw.style.opacity=1;sw.style.transform='translateY(0)';sw.getBoundingClientRect();
      sw.style.transition='transform .85s cubic-bezier(.5,0,.3,1)';sw.style.transform=`translateY(${h+70}px)`;
      bdot.setAttribute('fill',C.indigo);bdot.classList.add('blink');
      setTimeout(()=>{body.style.opacity=.15;},180);
      setTimeout(()=>{badge.textContent='Render '+n;mid&&mid();body.style.opacity=1;},480);
      setTimeout(()=>{bdot.classList.remove('blink');bdot.setAttribute('fill',C.mint);sw.style.opacity=0;},900);}};
}

/* ---------- React memory panel ---------- */
function panel(p,x,y,w,h){
  const [o,i]=placed(p,0,0);
  el('rect',{x,y,width:w,height:h,rx:18,fill:C.surf,filter:'url(#sh)'},i);
  el('rect',{x:x+14,y:y+12,width:28,height:28,rx:8,fill:C.indigo},i);icon(i,'memory',x+28,y+26,16,'#fff');
  txt(i,x+52,y+31,'React',{'font-size':14,'font-weight':800});
  const st=grp(i);let stDot,stT,stBg;
  stBg=el('rect',{x:x+w-112,y:y+15,width:98,height:22,rx:11,fill:C.paper},st);
  stDot=el('circle',{cx:x+w-100,cy:y+26,r:3.5,fill:C.grey},st);
  stT=txt(st,x+w-92,y+30,'Idle',{'font-size':10.5,'font-weight':700,fill:C.sub});
  const empty=txt(i,x+w/2,y+h-28,'No state stored',{'font-size':12,'font-weight':600,fill:C.grey,'text-anchor':'middle'});
  const slot=grp(i);hide(slot);
  el('rect',{x:x+14,y:y+52,width:w-28,height:h-66,rx:12,fill:C.paper},slot);
  txt(slot,x+28,y+52+(h-66)/2+5,'likes',{'font-size':14,'font-weight':600,'font-family':MONO});
  const gl=glow(slot,x+w-52,y+52+(h-66)/2,26);
  el('rect',{x:x+w-82,y:y+60,width:60,height:h-82,rx:9,fill:C.amberSoft,stroke:C.amber,'stroke-width':2},slot);
  const v=txt(slot,x+w-52,y+52+(h-66)/2+7,'0',{'font-size':20,'font-weight':800,'text-anchor':'middle'});
  return {g:o,
    status(t,col,soft){stT.textContent=t;stDot.setAttribute('fill',col);stT.setAttribute('fill',col===C.grey?C.sub:col);stBg.setAttribute('fill',soft||C.paper);},
    showSlot(val=0){empty.style.opacity=0;v.textContent=val;reveal(slot);gl.style.opacity=.9;},
    set(n){v.textContent=n;restart(v,'pulse');gl.style.opacity=.95;}};
}
function travel(path,{rev=false,dur=650,col=C.indigo}={},done){
  const L=path.getTotalLength(),par=path.parentNode;const h=el('circle',{r:12,fill:col,opacity:.22},par),d=el('circle',{r:5.5,fill:col},par);const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,pt=path.getPointAtLength((rev?1-e:e)*L);
    [h,d].forEach(c=>{c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);});
    if(k<1)requestAnimationFrame(f);else{h.remove();d.remove();done&&done();}})(t0);
}
function editor(p,x,y,w,h,file){
  const [o,i]=placed(p,0,0);
  el('rect',{x,y,width:w,height:h,rx:16,fill:C.code,filter:'url(#sh)'},i);
  el('path',{d:`M${x+16},${y} H${x+w-16} Q${x+w},${y} ${x+w},${y+16} V${y+38} H${x} V${y+16} Q${x},${y} ${x+16},${y}Z`,fill:'#242951'},i);
  [['#F2555A',18],['#FFB524',32],['#17B27B',46]].forEach(([f,dx])=>el('circle',{cx:x+dx,cy:y+19,r:4.5,fill:f},i));
  el('rect',{x:x+64,y:y+8,width:file.length*7+24,height:30,rx:7,fill:C.code},i);
  txt(i,x+76,y+27,file,{'font-size':11,'font-weight':600,'font-family':MONO,fill:'#C9CCF0'});
  return {g:o,i};
}

/* ---------- scenes ---------- */
const scenes=[
{ say:"Have you ever wondered why your like button stays stuck at zero, no matter how many times you tap it?",
  cap:["Have you ever wondered","why your like button","stays stuck at <b>zero</b>,","no matter how often you tap?"],

/* ---------- player ---------- */
let voiceOn=true,voice=null,runId=0,timers=[];const canSpeak='speechSynthesis' in window;
function pickVoice(){if(!canSpeak)return;const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]IN/i.test(v.lang))||vs.find(v=>/Google US English|Samantha|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null;}
if(canSpeak){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function sleep(ms){return new Promise(r=>later(r,ms));}
function speak(s){return new Promise(res=>{if(!voiceOn||!canSpeak)return res();const u=new SpeechSynthesisUtterance(s);if(voice)u.voice=voice;u.rate=1.03;
  let done=false;const fin=()=>{if(!done){done=true;res();}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,22000);});}
segsEl.innerHTML=scenes.map(()=>'<div class="seg"><i></i></div>').join('');const bars=[...segsEl.querySelectorAll('i')];
function showCap(h){capEl.innerHTML=h;capEl.classList.remove('in');capEl.getBoundingClientRect();capEl.classList.add('in');}
function clearWorld(){world.innerHTML='';defs.querySelectorAll('clipPath').forEach(c=>c.remove());}
async function runScene(k,id){const sc=scenes[k];
  world.style.transition='opacity .2s';world.style.opacity=0;await sleep(200);if(id!==runId)return;
  clearWorld();camReset();const ev=sc.build(world);world.style.opacity=1;
  const est=Math.max(2.8,sc.say.split(/\s+/).length*.37+.8);
  bars.forEach((b,j)=>{b.style.transition='none';b.style.width=j<k?'100%':'0';});bars[k].getBoundingClientRect();
  bars[k].style.transition=`width ${est}s linear`;bars[k].style.width='100%';
  const cw=sc.cap.map(c=>c.replace(/<[^>]+>/g,'').split(/\s+/).length),tot=cw.reduce((a,b)=>a+b,0);
  let acc=0;sc.cap.forEach((c,j)=>{later(()=>showCap(c),acc/tot*est*1000);acc+=cw[j];});
  ev.forEach(([f,fn])=>later(fn,f*est*1000));
  await Promise.all([sleep(est*1000),speak(sc.say)]);if(id!==runId)return;await sleep(250);}
async function play(){const id=++runId;clearTimers();if(canSpeak)speechSynthesis.cancel();overlay.hidden=true;
  for(let k=0;k<scenes.length;k++){if(id!==runId)return;await runScene(k,id);}
  if(id!==runId)return;document.getElementById('ovText').textContent='Watch again';document.getElementById('ovSub').textContent='Tap to replay';
  overlay.setAttribute('aria-label','Replay the reel');overlay.hidden=false;}
overlay.addEventListener('click',play);document.getElementById('replay').addEventListener('click',play);
const vb=document.getElementById('voice');vb.addEventListener('click',()=>{voiceOn=!voiceOn;vb.textContent=voiceOn?'Voice on':'Voice off';vb.setAttribute('aria-pressed',voiceOn);if(!voiceOn&&canSpeak)speechSynthesis.cancel();});
scenes[0].build(world);showCap("Have you ever wondered");
</script>
