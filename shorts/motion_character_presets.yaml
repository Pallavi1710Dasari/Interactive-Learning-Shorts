# Character presets for motion reels (REEL_STYLE=motion, the optional
# animated-character layer). OURS — kept outside web/src/motion/characters/,
# the copied rig, so updating that copy from the source repo never touches
# them. Loaded and validated by shorts/motion_character_presets.py.
#
# Every field is the rig's CharacterConfig (web/src/motion/characters/skins/
# config.ts): one config builds one person on the shared rig, so every
# gesture and expression works on all of them.
#
#   host       the asking speaker of every two-speaker reel (shared)
#   languages  one default per course language in motion_identities.yaml;
#              the answering speaker of a two-speaker reel, and the narrator
#              of a one-narrator reel. Clothing uses the language's
#              signature colour.
#   extras     other presets motion_reel --character can name.
#
# These are the DEFAULTS. The designer (#motion/characters/designer) saves
# edits to motion_character_presets.saved.yaml; "reset to default" removes a
# saved entry, and this file wins again.

