  # ------------------------------------------------------- linked-list chains
  #
  # `flow`, extended: separate boxes with a real gap and a real arrow, which is
  # most of what a linked list needs and a `state` container cannot draw — a
  # `state` frame is ONE physical container with contiguous slots, and an array
  # and a linked list rendering as visually-identical boxes with different text
  # was the measured complaint. Two additions, both free to check: a horizontal
  # run (a chain is normally drawn growing sideways, not falling down the
  # screen) and a drawn terminator (a linked list's last node genuinely points
  # at nothing, and that absence has to be ON SCREEN, not implied by the frame
  # simply stopping — the same argument Store.pointer_at=-1 already makes for
  # an empty stack).

  - id: E095
    name: A horizontal flow with a terminator draws separate nodes and a real stop mark
    why: >
      Wiring test for flow_orientation and flow_terminator. Before these fields,
      `flow` had no way to lay its steps out left to right, and nothing after
      the last step ever rendered — a chain simply ran out of boxes, which is
      indistinguishable from "the artist stopped drawing". This pins that both
      new fields actually reach the SVG: the terminator's own word ("null") and
      the circle-with-a-slash mark that draws it (_terminator in layout.py),
      distinct from the ordinary rectangles the three real nodes use.
    type: golden
    step: legend
    fixture: evals/fixtures/frame_flow_linked_list.json
    expect:
      must_contain: ["null", "<circle"]

