    voice: character_1
    symbol:                          # indentation: three bars, stepping in
      - {rect: [12, 16, 58, 15], r: 7.5}
      - {rect: [30, 42, 56, 15], r: 7.5}
      - {rect: [30, 68, 38, 15], r: 7.5, tone: soft}
