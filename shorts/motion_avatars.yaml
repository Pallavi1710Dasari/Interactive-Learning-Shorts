# The motion-reel AVATAR registry (RESTYLE_TO_MOTION_REELS.md, phase 2b).
# REEL_STYLE=motion only. CONTRACT ONLY in phase 2b: names, palettes and voice
# slots. The artwork, the scenes that place avatars and the recorded voices
# arrive in phase 3.
#
# Only themes with two speakers use avatars (shorts/motion_themes.yaml: a
# speaker's `avatar` is "language" or "host"). A one-narrator reel has none.
#
# `art` is what the player draws (web/src/motion/avatars/Avatar.tsx): one
# parametric, original character built from flat shapes — a body shape, a head
# shape, hair, a skin tone and accessories, coloured by the palette. `look` is
# the same character in words, for reviewers.
#
# RULES FOR THE ARTWORK (phase 3), checked by review, not code:
#   - Original designs. Never an official language logo or mascot, and never a
#     look-alike of one (no snake for Python, no coffee cup for Java, no atom
#     for React, no shield for HTML or CSS).
#   - The professional motion style of web/src/motion: flat geometric shapes,
#     the same stroke weight and corner radius as the cards, drawn in design
#     units and pure in `t` like every other component. No stick figures, no
#     clip art, no gradients beyond what the cards already use.
#   - Palettes never use coral (#F2555A), mint (#17B27B) or lavender
#     (#B9A8FF): those colours mean failure, success and system-added in every
#     motion reel (web/src/motion/tokens.ts). Nor is a body (primary) colour
#     one of the four field colours, or the character vanishes into that
#     field. shorts/motion_themes.py rejects both.
#
# Voice slots are Chatterbox reference clips. `voice_slot` names the clip; the
# file is voices/motion/<voice_slot>.wav, recorded in phase 3. Two speakers
# always get two different slots: the host and the language character.

# The course languages, in tag form (lowercase letters and digits only). Every
# reel gets exactly one of these as its language tag. Frameworks and tools are
# their own course languages: `node` covers Node.js and Express, `django` is
# Django (not plain python), `docker` is Docker. `os` is operating systems.
# `cs` is the fallback for material with no programming language (data
# structures, AI concepts).
languages: [python, javascript, typescript, react, node, django, html, css, sql, java, c, cpp, docker, os, cs]

# The one-narrator voice: every theme with a single speaker (classic_explainer,
# narrative, bug_hunt, ...) is read in this voice. No avatar is drawn for it.
narrator:
  voice_slot: motion_narrator

# The shared host: the asking role of two-speaker themes (interviewer, peer,
# student), the same character whatever the language.
host:
  id: host
  name: Juno
  look: Rounded square head, short swept hair, headset mic, navy jacket.
  art: {body: rounded, head: rounded_square, hair: swept, skin: s3, accessories: [headset]}
  palette: {primary: "#2F6F8F", secondary: "#091025", accent: "#FDD13E", ink: "#151936"}
  voice_slot: motion_host

