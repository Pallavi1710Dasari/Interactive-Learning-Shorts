      steps[0] first) shows the traversal running backwards. Every existing
      frame-shape check passes this: three real, distinct, connected nodes,
      correctly drawn as "flow". None of them can tell which end is the start.
    type: unit_grader
    grader: anchor_matches_structure
    fixture: evals/fixtures/anchor_flow_reversed_direction.json
    expect:
      passed: false
      reason_contains: "direction is reversed"

  - id: E111
    name: The same traversal with steps in the right order passes
    why: >
      THE FALSE-POSITIVE GUARD FOR E110. Identical strategy and anchor_label,
      only `steps` reordered to start at head.
    type: unit_grader
    grader: anchor_matches_structure
    fixture: evals/fixtures/anchor_flow_correct_direction.json
    expect:
      passed: true

  - id: E112
    name: A stack pointer aimed at the wrong slot is rejected
    why: >
      The narration and strategy both say `top` points at C, the most
      recently pushed item — and anchor_label names C — but pointer_at is 1,
      which is B's slot. -1 and out-of-range values are legitimate, meaningful
      states (Store.pointer_at's own docstring), so a bounds check could never
      catch this — pointer_at=1 is a perfectly valid index into a 3-slot
      stack, just the wrong one. Only comparing the claimed anchor against
      what is actually at that slot catches a confidently-wrong pointer.
    type: unit_grader
    grader: anchor_matches_structure
    fixture: evals/fixtures/anchor_state_pointer_wrong_slot.json
    expect:
      passed: false
      reason_contains: "wrong slot"

  - id: E113
    name: The same stack with top pointing at C passes
    why: >
      THE FALSE-POSITIVE GUARD FOR E112. Identical strategy and anchor_label,
      only pointer_at corrected from 1 to 2.
    type: unit_grader
    grader: anchor_matches_structure
    fixture: evals/fixtures/anchor_state_pointer_correct_slot.json
    expect:
      passed: true

  - id: E114
    name: An item that appears without ever arriving is rejected
    why: >
      Slot.state exists so a push is a picture rather than a relabel — but
      nothing before this compared one state frame to the next to confirm it
      was used that way. This frame introduces C already "resting", with no
      earlier frame showing it "arriving" — every other grader passes it (the
      template is right, the physical form is right, the picture did change),
      because the defect is not in what was drawn, it is in HOW C got there:
      teleported into the container instead of shown entering it.
    type: unit_grader
    grader: state_item_transitions_visible
    fixture: evals/fixtures/motion_insert_invisible.json
    expect:
      passed: false
      reason_contains: "no frame showing it arriving"

  - id: E115
    name: The same push with C shown arriving passes
    why: >
      THE FALSE-POSITIVE GUARD FOR E114. Identical stack, identical pointer
      move — only C's state changed from "resting" to "arriving" in the frame
      it first appears in.
    type: unit_grader
    grader: state_item_transitions_visible
    fixture: evals/fixtures/motion_insert_visible.json
    expect:
      passed: true

  - id: E116
    name: An item that vanishes without ever leaving is rejected
    why: >
      The inverse of E114: C is popped, and the next frame simply does not
      contain it — no frame marks it "leaving" first. A viewer sees the item
      disappear between beats rather than lift out of the container, the same
      invisible-transition defect on the removal side.
    type: unit_grader
    grader: state_item_transitions_visible
    fixture: evals/fixtures/motion_remove_invisible.json
    expect:
      passed: false
      reason_contains: "no frame marking it leaving"

  - id: E117
    name: A pop shown leaving, then gone, passes
    why: >
      THE FALSE-POSITIVE GUARD FOR E116, and it also exercises the third rule
      (a marked departure must actually finish): three frames — C resting,
      then C leaving, then C genuinely absent. Without this case the cheap way
      to make state_item_transitions_visible green is to reject every
      disappearance, which would break the real three-frame pop this pipeline
      is supposed to produce.
    type: unit_grader
    grader: state_item_transitions_visible
    fixture: evals/fixtures/motion_remove_visible.json
    expect:
      passed: true

  - id: E118
    name: A pointer retargeted to its own current slot is rejected
    why: >
      pointer_at_previous is set equal to pointer_at — a retarget that, per
      the field's own docstring, "asks for no animation at all". Structurally
      valid (both are real slot indices), and exactly the shape that lets a
      pointer look retargeted on paper while rendering as never having moved.
    type: unit_grader
    grader: state_pointer_moves_are_shown
    fixture: evals/fixtures/motion_pointer_no_move.json
    expect:
      passed: false
      reason_contains: "asks for no movement"

  - id: E119
    name: A pointer that moves with no retarget marked is rejected
    why: >
      top genuinely moves from slot 1 to slot 2 between two real frames, but
      the second frame leaves pointer_at_previous empty — the pointer will
      render already arrived at C with no disconnect-and-reconnect shown, the
      same silent-teleport defect check_state_item_transitions_visible
      catches for an item, here for the index that names one.
    type: unit_grader
    grader: state_pointer_moves_are_shown
    fixture: evals/fixtures/motion_pointer_silent_move.json
    expect:
      passed: false
      reason_contains: "pointer_at_previous was not set"

  - id: E120
    name: A correctly retargeted pointer passes
    why: >
      THE FALSE-POSITIVE GUARD FOR E118/E119. Reuses motion_insert_visible's
      own push sequence, where pointer_at_previous is filled in correctly —
      confirms the two failure fixtures above are not just rejecting every
      pointer_at_previous.
    type: unit_grader
    grader: state_pointer_moves_are_shown
    fixture: evals/fixtures/motion_insert_visible.json
    expect:
      passed: true

  - id: E121
    name: A traversal whose hero never advances is rejected
    why: >
      The same 3-node chain, drawn twice, with the hero still on "head" both
      times — the narration claims the traversal moved on to read the next
      pointer, but nothing about the picture shows it going anywhere. Neither
      check_frames_match_strategy nor check_physical_form_matches_template
      catches this: the template is correctly "flow" for a linked_nodes claim
      either way, and the defect is specifically that the hero did not move.
    type: unit_grader
    grader: flow_traversal_progresses
    fixture: evals/fixtures/motion_traversal_stuck.json
    expect:
      passed: false
      reason_contains: "hold still or move backwards"

  - id: E122
    name: A traversal whose hero moves to the next node passes
    why: >
      THE FALSE-POSITIVE GUARD FOR E121. Identical chain and identical
      narration, only the hero moved from "head" to "Node 2" in the second
      frame — the honest drawing of the same traversal actually progressing.
    type: unit_grader
    grader: flow_traversal_progresses
    fixture: evals/fixtures/motion_traversal_advances.json
    expect:
      passed: true

  - id: E123
    name: Four different concepts all forced into generic boxes is rejected
    why: >
      A hierarchy (table), a structure (split), a process (bar) and a
      comparison (compare) — four genuinely different kinds of claim, every
      one of them individually legal for its own relationship
      (check_frames_match_strategy and check_physical_form_matches_template
      both pass this fixture clean) and every frame distinct from the last
      (check_frames_develop passes too). What none of those ask is whether the
      reel, watched straight through, is one rounded-rectangle template after
      another regardless of what each beat is actually about — which is
      exactly what this is.
    type: unit_grader
    grader: generic_boxes_not_overused
    fixture: evals/fixtures/generic_boxes_overused.json
    expect:
      passed: false
      reason_contains: "different kinds of claim"

  - id: E124
    name: An all-comparison reel using compare throughout is not penalised
    why: >
      THE FALSE-POSITIVE GUARD FOR E123. Three `compare` frames in a row, and
      every one of them is a genuine comparison beat — the short's entire
      question is a three-way comparison across different measures. Without
      this case the cheap way to make generic_boxes_not_overused green is to
      cap every reel at one or two box frames, which would break the real
      short this pipeline is supposed to produce when comparison actually is
      the concept.
    type: unit_grader
    grader: generic_boxes_not_overused
    fixture: evals/fixtures/generic_boxes_consistent_comparison.json
    expect:
      passed: true

  # ----------------------------------------------------------------- vision judge
  #
  # skills/vision.py's judge_frames is the one component in this pipeline that
  # looks at ACTUAL RENDERED PIXELS rather than reads a description of them, and
  # until these three cases it had no regression coverage at all — every other
  # fixture in this file is graded by free deterministic code. These need a real
  # model call AND a working headless Chromium (see shorts/raster.py), so they
  # are gated behind --judge like every other real-model case.

  - id: E103
    name: A visually unrelated sequence is flagged as fragmented
    why: >
      The narration is one coherent explanation (paging vs contiguous
      allocation), but the frames are not — a bar, a font preview, a rating
      stat and a weather icon pair, none of them about memory at all. No
      structural grader catches this: each frame is individually well-formed,
      each template is used correctly, and check_frames_develop is satisfied by
      frames merely differing from each other, which four unrelated pictures
      trivially do. Only looking at the sequence as a picture shows it never
      develops one subject.
    type: vision_judge
    fixture: evals/fixtures/vision_fragmented_sequence.json
    expect:
      composition_problems_present: true

  - id: E104
    name: A comparison that only differs in its words is flagged
    why: >
      The strategy for d_compare explicitly asks to SEE the mutable object
      change in place and a new object appear beside the immutable one — and
      the frame drawn is two identical boxes, one per panel, differing only in
      their titles ("Mutable" / "Immutable"). A learner reading the words would
      get the distinction; a learner looking at the picture would not, which is
      exactly the "important distinction shown only through text" failure this
      pipeline has no other way to catch — check_frames_match_strategy checks
      the TEMPLATE is legal for a comparison, not that the two sides actually
      look different.
    type: vision_judge
    fixture: evals/fixtures/vision_distinction_only_in_text.json
    expect:
      any_frame_failed: true

  - id: E105
    name: A genuinely coherent sequence is never called fragmented
    why: >
      THE FALSE-POSITIVE GUARD FOR E103, RESHAPED BY WHAT TWO REAL RUNS SAID.
      developing_frames.json looked coherent on paper and got genuinely
      flagged — frame 2 abandons the visual language, frames 1 and 3 are
      near-identical — a real catch, not noise. visual_state_happens.json (one
      persistent stack, slots changing across all four frames: empty, push A,
      push C, pop C) got flagged too, on its own genuine merits: push and pop
      look too similar, an item never visibly lands in its slot. Both are true
      findings about this renderer, not false positives, and asserting
      "zero composition_problems" would have this guard chasing a bar this
      judge — correctly — may never grant any fixture.
      So the guard is narrower and still real: this composition, uncontrived,
      single-subject and genuinely progressing, must never be told it is a set
      of UNRELATED, DISCONNECTED frames with no developing thread — the actual
      fragmentation claim E103 exists to catch. Every complaint the real run
      returned was about ONE frame's geometry or the stack's own rendering,
      never that. A judge that starts calling this sequence disconnected is
      regressing on the failure this pair of cases is actually about.
    type: vision_judge
    fixture: evals/fixtures/visual_state_happens.json
    expect:
      composition_problems_exclude:
        - "unrelated"
        - "disconnected"
        - "different subject"
        - "no shared"
        - "does not develop one subject"
        - "never develops one subject"

  # ------------------------------------------------------------------ llm judge

  - id: E008
    name: Judge flags the fabricated hugepage script
    why: "The code grader catches it, but the judge must catch it too — subtler cases exist."
    type: llm_judge
    section_id: "3.5"
    fixture: evals/fixtures/hallucinated.json
    expect:
      faithfulness_max: 2
      passed: false

  - id: E009
    name: Judge approves the grounded page-fault script
    why: "A judge that fails everything is useless. This is the false-positive guard."
    type: llm_judge
    section_id: "3.3"
    fixture: evals/fixtures/good_page_fault.json
    expect:
      faithfulness_min: 4
      passed: true

  # --------------------------------------------------------------------- golden

  - id: E010
    name: Skill 1 still selects the page fault path from session 18
    why: "Topic selection silently drifted after a prompt edit and dropped the core concept."
    type: golden
    step: select
    input: content/session_18_paging.md
    expect:
      must_include_sections: ["3.2", "3.3"]
      topic_count_between: [4, 6]


# ============================================================================
# RUBRIC — what the LLM judge scores, 1 to 5. Keep the wording stable; changing
# a rubric invalidates every historical score you have logged.
# ============================================================================

rubric:
  faithfulness:
    5: "Every claim is stated in or directly implied by the source section."
    4: "Every claim traces to the source; one minor rewording is looser than ideal."
    3: "One claim is plausible but not actually present in the section."
    2: "Multiple claims are not in the section, or a specific number/name is invented."
    1: "The script is substantially about something the section does not cover."

  clarity:
    5: "A learner who has not read the doc understands it on first listen."
    4: "Clear, one sentence could be tighter."
    3: "Understandable but requires re-listening."
    2: "Jargon used before it is defined."
    1: "Confusing or self-contradictory."

  pace:
    5: "Beats are evenly sized; no beat runs past ~12 seconds."
    4: "Slightly uneven but watchable."
    3: "One beat is noticeably long."
    2: "Beats are wildly uneven."
    1: "Effectively a monologue."

  diagram_correct:
    true: "Every diagram spec matches what the narration says at that moment and is technically accurate."
    false: "Any diagram contradicts the narration or is technically wrong."

pass_threshold:
  faithfulness: 4
  clarity: 4
  pace: 3
  diagram_correct: true
